<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>아침 브리핑</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--sub:#64748b;--ac:#2563eb;--bd:#e2e8f0}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--sub:#94a3b8;--ac:#60a5fa;--bd:#334155}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Noto Sans KR",sans-serif;
padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 24px)}
main{max-width:640px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:1.25rem;margin:0}
.sub{color:var(--sub);font-size:.8rem}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:12px}
h2{font-size:.85rem;color:var(--sub);margin:0 0 8px;letter-spacing:.02em}
.pre{white-space:pre-wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tabs button{background:transparent;color:var(--sub);border:1px solid var(--bd);white-space:nowrap}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
ul{list-style:none;margin:0;padding:0}
li{padding:9px 0;border-top:1px solid var(--bd)}
li:first-child{border-top:0}
a{color:var(--tx);text-decoration:none}
a:active{color:var(--ac)}
li .sub{display:block}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>☀️ 아침 브리핑</h1><div class="sub" id="upd">불러오는 중…</div></div>
    <button id="rf">새로고침</button>
  </header>
  <section class="card"><h2>🌤 날씨</h2><div class="pre" id="weather">-</div></section>
  <section class="card" id="evCard" hidden><h2>📅 오늘 일정</h2><div class="pre" id="events"></div></section>
  <section class="card"><h2>📰 뉴스 요약</h2><div class="pre" id="summary">-</div></section>
  <section class="card"><h2>기사 목록</h2><div class="tabs" id="tabs"></div><ul id="list"></ul></section>
</main>
<script>
const $ = id => document.getElementById(id);
let news = {}, cur = null;

function renderList() {
  const ul = $("list"); ul.textContent = "";
  const items = news[cur] || [];
  if (!items.length) { const li = document.createElement("li"); li.className = "sub"; li.textContent = "최근 24시간 기사가 없어요."; ul.append(li); return; }
  for (const it of items) {
    const li = document.createElement("li"), a = document.createElement("a");
    a.textContent = it.title;
    if (/^https?:\/\//.test(it.link)) { a.href = it.link; a.target = "_blank"; a.rel = "noopener"; }
    li.append(a);
    if (it.source) { const s = document.createElement("span"); s.className = "sub"; s.textContent = it.source; li.append(s); }
    ul.append(li);
  }
}
function renderTabs() {
  const t = $("tabs"); t.textContent = "";
  for (const k of Object.keys(news)) {
    const b = document.createElement("button");
    b.textContent = `${k} ${news[k].length}`;
    if (k === cur) b.className = "on";
    b.onclick = () => { cur = k; renderTabs(); renderList(); };
    t.append(b);
  }
}
async function load() {
  $("upd").textContent = "불러오는 중…";
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const dt = new Date(d.updated);
    $("upd").textContent = "업데이트 " + dt.toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    $("weather").textContent = d.weather;
    $("summary").textContent = d.summary;
    $("evCard").hidden = !d.events; if (d.events) $("events").textContent = d.events;
    news = d.news || {};
    if (!(cur in news)) cur = Object.keys(news)[0];
    renderTabs(); renderList();
  } catch (e) {
    $("upd").textContent = "데이터가 아직 없어요. GitHub Actions를 한 번 실행해 주세요.";
  }
}
$("rf").onclick = load;
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
load();
</script>
</body>
</html>
