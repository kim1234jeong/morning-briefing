<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>아침 브리핑</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --tx: #0f172a;
  --sub: #64748b;
  --ac: #0f172a;       /* 라이트 모드 활성 탭 (고대비 블랙) */
  --ac-tx: #ffffff;
  --bd: #e2e8f0;
  --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
  --btn-bg: #f1f5f9;
  --btn-tx: #0f172a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b;
    --card: #18181b;
    --tx: #fafafa;
    --sub: #a1a1aa;
    --ac: #fafafa;       /* 다크 모드 활성 탭 (고대비 화이트) */
    --ac-tx: #09090b;
    --bd: #27272a;
    --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
    --btn-bg: #27272a;
    --btn-tx: #fafafa;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { 
  margin: 0; 
  background: var(--bg); 
  color: var(--tx); 
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  line-height: 1.6;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
  transition: background-color 0.3s, color 0.3s;
}
main { max-width: 600px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; padding: 0 4px; }
h1 { font-size: 1.6rem; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.02em; }
.sub { color: var(--sub); font-size: 0.85rem; font-weight: 500; }
button { 
  background: var(--btn-bg); color: var(--btn-tx); 
  border: none; border-radius: 99px; 
  padding: 8px 16px; font-weight: 600; font-size: 0.85rem; 
  cursor: pointer; transition: all 0.2s ease;
}
button:active { transform: scale(0.95); }
.card { 
  background: var(--card); border: 1px solid var(--bd); 
  border-radius: 24px; padding: 20px; margin-bottom: 16px; 
  box-shadow: var(--shadow);
}
h2 { 
  font-size: 0.8rem; color: var(--sub); margin: 0 0 12px; 
  letter-spacing: 0.05em; font-weight: 700; text-transform: uppercase;
}
.pre { white-space: pre-wrap; font-weight: 500; font-size: 0.95rem; color: var(--tx); line-height: 1.65; }
.tabs { 
  display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; 
  padding-bottom: 4px; scrollbar-width: none; 
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button { 
  background: transparent; color: var(--sub); 
  border: 1px solid var(--bd); white-space: nowrap; 
}
.tabs button.on { 
  background: var(--ac); color: var(--ac-tx); border-color: var(--ac); 
}
ul { list-style: none; margin: 0; padding: 0; }
li { padding: 14px 0; border-bottom: 1px solid var(--bd); display: flex; flex-direction: column; gap: 4px; }
li:last-child { border-bottom: none; padding-bottom: 0; }
li:first-child { padding-top: 0; }
a { color: var(--tx); text-decoration: none; font-weight: 600; font-size: 1rem; line-height: 1.4; transition: opacity 0.2s; }
a:hover, a:active { opacity: 0.6; }
li .sub { display: inline-block; font-size: 0.8rem; margin-top: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>☀️ 아침 브리핑</h1>
      <div class="sub" id="upd">데이터를 불러오는 중입니다...</div>
    </div>
    <button id="rf">새로고침</button>
  </header>
  
  <section class="card">
    <h2>🌤 날씨</h2>
    <div class="pre" id="weather">-</div>
  </section>
  
  <section class="card" id="evCard" hidden>
    <h2>📅 오늘 일정</h2>
    <div class="pre" id="events"></div>
  </section>
  
  <section class="card">
    <h2>📰 뉴스 요약</h2>
    <div class="pre" id="summary">-</div>
  </section>
  
  <section class="card">
    <h2>기사 목록</h2>
    <div class="tabs" id="tabs"></div>
    <ul id="list"></ul>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let news = {}, cur = null;

function renderList() {
  const ul = $("list"); ul.textContent = "";
  const items = news[cur] || [];
  if (!items.length) { 
    const li = document.createElement("li"); 
    li.className = "sub"; li.style.padding = "20px 0"; li.style.textAlign = "center"; 
    li.textContent = "최근 24시간 기사가 없습니다."; 
    ul.append(li); 
    return; 
  }
  for (const it of items) {
    const li = document.createElement("li"), a = document.createElement("a");
    a.textContent = it.title;
    if (/^https?:\/\//.test(it.link)) { a.href = it.link; a.target = "_blank"; a.rel = "noopener"; }
    li.append(a);
    if (it.source) { const s = document.createElement("span"); s.className = "sub"; s.textContent = it.source; li.append(s); }
    ul.append(li);
  }
}
function renderTabs() {
  const t = $("tabs"); t.textContent = "";
  for (const k of Object.keys(news)) {
    const b = document.createElement("button");
    b.textContent = `${k} ${news[k].length}`;
    if (k === cur) b.className = "on";
    b.onclick = () => { cur = k; renderTabs(); renderList(); };
    t.append(b);
  }
}
async function load() {
  $("upd").textContent = "데이터를 불러오는 중입니다...";
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const dt = new Date(d.updated);
    $("upd").textContent = "업데이트 " + dt.toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    $("weather").textContent = d.weather;
    $("summary").textContent = d.summary;
    $("evCard").hidden = !d.events; if (d.events) $("events").textContent = d.events;
    news = d.news || {};
    if (!(cur in news)) cur = Object.keys(news)[0];
    renderTabs(); renderList();
  } catch (e) {
    $("upd").textContent = "데이터가 없습니다. GitHub Actions를 실행해 주세요.";
  }
}
$("rf").onclick = load;
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
load();
</script>
</body>
</html>
